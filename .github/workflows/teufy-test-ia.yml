name: Teufy - tester les IA
# Une toute petite requête à chaque IA pour vérifier les crédits (après une recharge). Coût négligeable.
on:
  workflow_dispatch:
    inputs:
      exception_ia:
        description: "Exception du directeur : autoriser Gemini/Claude pour ce lancement manuel (sinon aucune IA payante)"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  tester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tester Gemini et Claude
        env:
          GEMINI_API_KEY: ${{ (inputs.exception_ia) && (secrets.GEMINI_API_KEY) || '' }}
          ANTHROPIC_API_KEY: ${{ (inputs.exception_ia) && (secrets.ANTHROPIC_API_KEY) || '' }}
        run: node outils/tester-ia.mjs
