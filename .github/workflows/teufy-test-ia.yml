name: Teufy - tester les IA
# Une toute petite requête à chaque IA pour vérifier les crédits (après une recharge). Coût négligeable.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tester:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Tester Gemini et Claude
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node outils/tester-ia.mjs
