name: Teufy - Veille et publication réactive

# Toutes les heures de 8h à 22h (heure de Paris, à une heure près selon la saison) :
#  - lit les posts récents des organisateurs suivis et cherche les annonces et l'actu du jour (IA gratuite) ;
#  - si une annonce exceptionnelle et vérifiée vient de tomber, crée le post et le publie tout de suite
#    (1 par jour maximum) ; sinon ne fait que noter les idées dans contenus/idees.json.
# La détection est légère : Chromium, ffmpeg et le studio ne s'installent que s'il y a quelque chose à publier.
on:
  schedule:
    - cron: "11 6-20/2 * * *" # toutes les 2 h de 7h à 21h à Paris (13/11/2026 : toutes les 30 min consommait trop de minutes GitHub)
  workflow_dispatch:
    inputs:
      publier:
        description: "Publier vraiment sur Instagram si un sujet exceptionnel est trouvé"
        type: boolean
        default: false
      forcer:
        description: "Passer outre le rythme d'une heure (passage demandé par le directeur)"
        type: boolean
        default: false
      horaire:
        description: "Passage automatique (déclencheur externe) : IA payante autorisée. Ne pas cocher à la main."
        type: boolean
        default: false
      exception_ia:
        description: "Exception écrite du directeur : autoriser Gemini et Claude pour ce lancement manuel"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write # relancer la veille technique (sans IA) quand GitHub a sauté son horaire
  models: read

concurrency:
  group: teufy-veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Clés : plusieurs noms de secrets acceptés (ElevenLabs, Gemini, Claude, Instagram…)
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN || secrets.INSTAGRAM_ACCESS_TOKEN || secrets.INSTAGRAM_TOKEN || secrets.IG_TOKEN || secrets.META_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID || secrets.INSTAGRAM_USER_ID || secrets.INSTAGRAM_ID || secrets.IG_ID || secrets.IG_ACCOUNT_ID || secrets.INSTAGRAM_ACCOUNT_ID }}
      GEMINI_API_KEY: ${{ (github.event_name == 'schedule' || inputs.horaire || inputs.exception_ia) && (secrets.GEMINI_API_KEY || secrets.GEMINI_KEY || secrets.GEMINI || secrets.GOOGLE_API_KEY || secrets.GOOGLE_AI_KEY || secrets.GOOGLE_AI_API_KEY || secrets.GEMINI_TOKEN || secrets.AI_STUDIO_KEY || secrets.CLE_GEMINI || secrets.API_GEMINI) || '' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }} # IA gratuite (Groq, sans carte bancaire), 20/11/2026
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || '' }} # moteur de recherche web gratuit (Tavily, 1 000 recherches par mois), 20/11/2026
      TIKTOK_CODE: ${{ secrets.TIKTOK_CODE }} # code de la page /tiktok/ (choisi par le directeur, jamais écrit dans le dépôt)
      GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN || '' }} # visites du site, lecture seule (22/11/2026)
      ANTHROPIC_API_KEY: ${{ (github.event_name == 'schedule' || inputs.horaire || inputs.exception_ia) && (secrets.ANTHROPIC_API_KEY || secrets.ANTHROPIC_KEY || secrets.ANTHROPIC || secrets.CLAUDE_API_KEY || secrets.CLAUDE_KEY || secrets.CLAUDE) || '' }}
      # Règle du directeur : IA payante seulement pour les passages automatiques (horaire GitHub ou déclencheur externe avec
      # « horaire »). Groq et Tavily, gratuits, restent toujours disponibles.
      TEUFY_IA_MANUEL: ${{ (github.event_name == 'schedule' || inputs.horaire || inputs.exception_ia) && '0' || '1' }}
      IG_API_HOST: ${{ vars.IG_API_HOST || 'graph.facebook.com' }}
      EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN || '' }} # API officielle Eventbrite, jeton personnel gratuit (22/11/2026)
      TICKETMASTER_KEY: ${{ secrets.TICKETMASTER_KEY || '' }} # API officielle Ticketmaster Discovery, clé gratuite (22/11/2026)
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MEDIA_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/media
      MEDIA_FALLBACK_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/media
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Veille technique en retard ? (GitHub saute parfois ses horaires) — la relancer, elle n'utilise aucun crédit d'IA
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DERNIER=$(gh run list -R "$GITHUB_REPOSITORY" --workflow teufy-veille-technique.yml --status success --limit 1 --json createdAt -q '.[0].createdAt' 2>/dev/null || echo "")
          AGE=$(( $(date +%s) - $(date -d "${DERNIER:-1970-01-01}" +%s) ))
          # 23/11/2026 : seul un passage réussi compte (un échec du matin est repris au passage suivant), sauf si un passage est déjà en cours.
          # 22/11/2026 : l'horaire de 6 h 17 a été sauté (dernier passage 21/11 à 14 h 29) : relance aussi dès 7 h si rien aujourd'hui.
          EN_COURS=$(gh run list -R "$GITHUB_REPOSITORY" --workflow teufy-veille-technique.yml --limit 3 --json status -q '[.[] | select(.status != "completed")] | length' 2>/dev/null || echo 0)
          if [ "${EN_COURS:-0}" -gt 0 ]; then echo "Veille technique en cours."; elif [ "$AGE" -gt 72000 ] || { [ "${DERNIER:0:10}" != "$(date -u +%F)" ] && [ "$(date -u +%H)" -ge 6 ]; }; then gh workflow run teufy-veille-technique.yml -R "$GITHUB_REPOSITORY" --ref main && echo "Veille technique relancée (dernier passage il y a $((AGE/3600)) h)."; else echo "Veille technique à jour."; fi

      - name: Veille (détection)
        id: veille
        run: |
          npm install --no-audit --no-fund
          PUBLIER=false
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.publier }}" = "true" ]; then PUBLIER=true; fi
          [ -z "$IG_ACCESS_TOKEN" ] && PUBLIER=false
          echo "publier=$PUBLIER" >> "$GITHUB_OUTPUT"
          # La préparation s'arrête seule (rien=true) si aucun sujet ne mérite un post immédiat.
          command -v ffmpeg >/dev/null || timeout 240 sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null 2>&1 || true # 20/11 : l'installation a pris 22 min une fois, plafonnée à 4 min
          npm ci --prefix studio --no-audit --no-fund
          VEILLE_FORCER=${{ inputs.forcer && '1' || '0' }} node src/run.mjs veille preparer $([ "$PUBLIER" = "true" ] || echo --dry-run)

      - name: Répondre aux commentaires
        if: always()
        continue-on-error: true
        run: node src/commentaires.mjs $([ "${{ steps.veille.outputs.publier }}" = "true" ] || echo --dry-run)

      - name: Enregistrer la veille (sujets vus, idées, journal)
        if: always()
        run: |
          git config user.name "teufy-bot"
          git config user.email "teufy-bot@users.noreply.github.com"
          git add -A -- $(ls -d contenus/veille-vus.json contenus/idees.json contenus/actus.json contenus/commentaires.json contenus/suggestions-nuit.json contenus/budget-ia.json evenements-web.json veille 2>/dev/null) || true # seulement les chemins existants (un seul absent bloquait tout)
          git diff --cached --quiet && exit 0
          git commit -m "Teufy : veille du $(date -u +'%F %Hh')"
          for i in 1 2 3; do git pull --rebase -X theirs --autostash && git push && break; git rebase --abort 2>/dev/null; sleep 5; done

      - name: Mettre à jour le site (nouvelle actu ou nouveau jour)
        if: always()
        continue-on-error: true
        run: |
          # Ne régénère que si une nouvelle actu est arrivée ou au premier passage de la journée (repère site/.maj).
          command -v tesseract >/dev/null || timeout 240 sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra >/dev/null 2>&1 || true # repère les « photos de lieu » qui sont des affiches
          node outils/visites.mjs || true # visites du site (GoatCounter) pour le tableau de bord
          # 24/11/2026 (directeur) : reconstruction au plus une fois par heure (passages de la première demi-heure), pour ne pas
          # vider l'IA dès le matin ; un nouveau jour ou un lancement « forcer » passe toujours.
          if [ "$(date -u +%M)" -ge 30 ] && [ "${{ inputs.forcer }}" != "true" ] && [ -f site/.maj ] && grep -q "^$(TZ=Europe/Paris date +%F)" site/.maj; then echo "Site : reconstruit à la demi-heure précédente, prochain passage à l'heure."; exit 0; fi
          SITE_MINUTES=6 timeout 15m node src/run.mjs site || { echo "::warning::Mise à jour du site arrêtée (plus de 15 min ou erreur) : reprise au passage suivant"; exit 0; } # 21/11 : 3 passages coupés à 30 min sans journal lisible
          node outils/controle-donnees.mjs || echo "::warning::Contrôle des données du site : erreurs à corriger (voir ci-dessus)"
          git add contenus/corrections-auto.json 2>/dev/null || true # soirées écartées par le contrôle (24/11/2026 : « le contrôle doit corriger »)
          git add -A -- $(ls -d tiktok media/tiktok index.html 404.html .nojekyll site a-propos soirees-* soiree festivals actus partenaires ambassadeurs bde mentions-legales cgu cgv confidentialite dates restaurants activites france occitanie clubs-bars evenements-france.json evenements-occitanie.json en it es zh ar sitemap.xml robots.txt llms.txt *.txt .well-known CNAME sw.js contenus evenements-web.json 2>/dev/null) || true # seulement les chemins existants (un seul absent bloquait tout)
          git add -A -- $(for d in */; do [ -f "${d}index.html" ] && echo "${d%/}"; done) 2>/dev/null || true # 20/11/2026 : toute page du site (une page oubliée dans la liste, comme /mises-a-jour/, renvoyait une erreur 404)
          git diff --cached --quiet && exit 0
          git commit -m "Teufy : site mis à jour (veille)"
          for i in 1 2 3; do git pull --rebase -X theirs --autostash && git push && break; git rebase --abort 2>/dev/null; sleep 5; done

      - name: Aperçu
        if: steps.veille.outputs.rien != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: veille-${{ github.run_number }}
          path: media/veille/
          retention-days: 14
          if-no-files-found: ignore

      - name: Mettre le visuel en ligne et publier
        if: steps.veille.outputs.rien != 'true' && steps.veille.outputs.publier == 'true'
        run: |
          [ -f media/veille/publication.json ] || exit 0
          git add media/veille
          git commit -m "Teufy : post de veille du $(date -u +'%F %Hh')"
          for i in 1 2 3; do git pull --rebase -X theirs --autostash && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
          node src/run.mjs veille publier
          git add -A -- $(ls -d historique.json contenus/veille-vus.json contenus/comptes-verifies.json contenus/budget-ia.json 2>/dev/null) || true # seulement les chemins existants (un seul absent bloquait tout)
          git diff --cached --quiet || git commit -m "Teufy : post de veille publié"
          for i in 1 2 3; do git pull --rebase -X theirs --autostash && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
