name: Teufy - Contrôle qualité du site

# Protocole qualité permanent : à chaque modification du code du site, tous les tests sont relancés
# (liens, SEO, scénarios d'usage sur mobile / tablette / ordinateur, scénarios « casser le site »),
# avec les trois moteurs de navigateur : Chromium (Chrome, Edge, Android), WebKit (Safari, iPhone) et Firefox.
# Un échec apparaît en rouge dans l'onglet Actions avec la liste des problèmes.
on:
  push:
    branches: [main]
    paths:
      - 'src/site*.mjs'
      - 'site/app.js'
      - 'site/style.css'
      - 'site/sw-source.js'
      - 'outils/**'
      - '.github/workflows/teufy-qualite.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teufy-qualite
  cancel-in-progress: true

jobs:
  statique:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Liens internes
        run: node outils/verifier-liens.mjs
      - name: SEO, partage, images, sécurité
        run: node outils/audit-seo.mjs

  navigateurs:
    runs-on: ubuntu-22.04 # dépendances de WebKit (Safari) prises en charge par Playwright
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        navigateur: [chromium, webkit, firefox]
    env:
      NAVIGATEUR: ${{ matrix.navigateur }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Garder les navigateurs de test en cache (installation plus rapide et plus fiable)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.navigateur }}-${{ hashFiles('package-lock.json') }}
      - name: Installer Playwright et le navigateur
        timeout-minutes: 25
        run: |
          npm install --no-audit --no-fund
          # Le navigateur lui-même (CDN Playwright), indépendant des serveurs Ubuntu.
          for i in 1 2 3; do timeout 300 npx playwright install ${{ matrix.navigateur }} && break; sleep 10; done
          # Bibliothèques système : le miroir Ubuntu d'Azure tombe parfois (« Temporary failure resolving
          # azure.archive.ubuntu.com ») : on passe sur le serveur Ubuntu principal, et on libère apt entre deux essais.
          echo "http://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null || true
          sudo sed -i 's#http://azure.archive.ubuntu.com/ubuntu#http://archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list 2>/dev/null || true
          for i in 1 2 3; do
            timeout 420 sudo -E env "PATH=$PATH" npx playwright install-deps ${{ matrix.navigateur }} && exit 0
            echo "Essai $i échoué, nouvel essai…"; sudo pkill -9 -f apt-get || true; sudo rm -f /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock; sudo dpkg --configure -a || true; sleep 15
          done
          exit 1
      - name: Servir le site comme GitHub Pages
        run: |
          node outils/serveur-local.cjs &
          sleep 2
      - name: Scénarios « casser le site »
        run: node outils/tester-robustesse.cjs
      - name: Sécurité (clés, injections, CSP, liens, robots)
        if: matrix.navigateur == 'chromium'
        run: node outils/tester-securite.cjs
      - name: Scénarios d'usage (mobile, tablette, ordinateur)
        if: always()
        run: node outils/tester-site.cjs
