name: Teufy - Contrôle qualité du site

# Protocole qualité permanent : à chaque modification du code du site, tous les tests sont relancés
# (liens, SEO, scénarios d'usage sur mobile / tablette / ordinateur, scénarios « casser le site »),
# avec les trois moteurs de navigateur : Chromium (Chrome, Edge, Android), WebKit (Safari, iPhone) et Firefox.
# Un échec apparaît en rouge dans l'onglet Actions avec la liste des problèmes.
on:
  push:
    branches: [main]
    paths:
      - 'src/site*.mjs'
      - 'site/app.js'
      - 'site/style.css'
      - 'site/sw-source.js'
      - 'outils/**'
      - '.github/workflows/teufy-qualite.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teufy-qualite
  cancel-in-progress: true

jobs:
  statique:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Liens internes
        run: node outils/verifier-liens.mjs
      - name: SEO, partage, images, sécurité
        run: node outils/audit-seo.mjs

  navigateurs:
    runs-on: ubuntu-22.04 # dépendances de WebKit (Safari) prises en charge par Playwright
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        navigateur: [chromium, webkit, firefox]
    env:
      NAVIGATEUR: ${{ matrix.navigateur }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Installer Playwright et le navigateur
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps ${{ matrix.navigateur }}
      - name: Servir le site comme GitHub Pages
        run: |
          node outils/serveur-local.cjs &
          sleep 2
      - name: Scénarios « casser le site »
        run: node outils/tester-robustesse.cjs
      - name: Sécurité (clés, injections, CSP, liens, robots)
        if: matrix.navigateur == 'chromium'
        run: node outils/tester-securite.cjs
      - name: Scénarios d'usage (mobile, tablette, ordinateur)
        if: always()
        run: node outils/tester-site.cjs
