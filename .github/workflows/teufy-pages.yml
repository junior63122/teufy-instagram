name: Teufy - Mise en ligne du site (GitHub Pages)

# 13/11/2026 (directeur : « je ne veux pas que les gens volent mon code ») : avant, GitHub Pages publiait TOUT le dépôt
# (teufyparty.com/src/site.mjs, /config.json, /CLAUDE.md… étaient téléchargeables). Désormais seul le site est mis en
# ligne : pages HTML, styles, scripts du navigateur, images et médias Instagram. Le code des robots, la configuration,
# les données de travail et les consignes restent dans le dépôt.
# Réglage à faire une fois : Settings → Pages → Build and deployment → Source : « GitHub Actions ».
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sauvegarde:
        description: "Remettre en ligne une sauvegarde (ex. sauvegarde-2026-11-21) ; vide = version actuelle"
        required: false
        default: ""
  # Les robots poussent avec le jeton GitHub, ce qui ne relance pas les workflows « push » : on publie à la fin de leur passage.
  workflow_run:
    workflows: ["Teufy - Instagram automatique", "Teufy - Lieux (images, carte, transports)", "Teufy - Veille et publication réactive", "Teufy - Paiements", "Teufy - Prospection", "Teufy - Studio (décors illustrés)"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.essai1.outputs.page_url || steps.deploiement.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      # Retour à une sauvegarde (21/11/2026, directeur : « des sauvegardes du site pour revenir à une version précédente en cas
      # de souci grave ») : soit demandée à la main (champ « sauvegarde »), soit figée dans contenus/gel-site.txt (nom de la
      # sauvegarde) tant que le souci n'est pas réparé : les robots continuent, mais c'est la sauvegarde qui reste en ligne.
      - name: Version à mettre en ligne (actuelle ou sauvegarde)
        env:
          DEMANDE: ${{ inputs.sauvegarde }}
        run: |
          CIBLE="$DEMANDE"
          [ -z "$CIBLE" ] && [ -f contenus/gel-site.txt ] && CIBLE=$(head -1 contenus/gel-site.txt | tr -cd 'A-Za-z0-9._-')
          if [ -n "$CIBLE" ]; then
            case "$CIBLE" in sauvegarde-*) ;; *) echo "::error::Nom de sauvegarde invalide : $CIBLE"; exit 1;; esac
            git fetch --depth 1 origin "refs/tags/$CIBLE:refs/tags/$CIBLE" && git checkout -q "$CIBLE"
            echo "::warning::Site remis à la sauvegarde $CIBLE (pour revenir à la version actuelle : supprimer contenus/gel-site.txt)"
          else echo "Version actuelle du site."; fi
      - name: Ne garder que le site public
        run: |
          mkdir -p ../_site
          rsync -a --delete \
            --exclude='.git*' --exclude='.github' --exclude='.claude' \
            --exclude='src/' --exclude='outils/' --exclude='tests/' --exclude='studio/' --exclude='contenus/' \
            --exclude='node_modules/' --exclude='out/' --exclude='livrables/' --exclude='veille/' --exclude='apercus/' \
            --exclude='/*.json' --exclude='/*.md' --exclude='*.mjs' --exclude='*.cjs' \
            --exclude='site/sw-source.js' --exclude='site/app.js' --exclude='site/style.css' \
            ./ ../_site/
          mv ../_site ./_site
          touch _site/.nojekyll
          du -sh _site; test -f _site/index.html && test -f _site/CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      # 21/11/2026 : 9 échecs « No artifacts named github-pages » le même jour (l'envoi était fini, GitHub ne le voyait pas
      # encore 0,4 s après) → mails d'échec au directeur. Deuxième essai 30 s plus tard ; échec seulement si les deux ratent.
      - id: essai1
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Attendre avant le deuxième essai
        if: steps.essai1.outcome == 'failure'
        run: sleep 30
      - id: deploiement
        if: steps.essai1.outcome == 'failure'
        uses: actions/deploy-pages@v4
