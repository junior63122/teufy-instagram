name: Teufy - Veille technique (mises à jour des prestataires)

# Chaque jour, sans IA et sans dépense : version de l'API Instagram, modèles d'IA encore ouverts (simple liste, aucun
# crédit consommé), actions GitHub et Node, failles npm, état de chaque billetterie, informations manquantes des soirées.
# Le relevé (contenus/veille-technique.json) est lu chaque jour par Claude, qui répare et s'adapte (directeur, 20/11/2026).
on:
  workflow_dispatch: {}
  schedule:
    - cron: "17 5 * * *"

permissions:
  contents: write

concurrency:
  group: teufy-veille-technique
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Relevé
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN || secrets.INSTAGRAM_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID || secrets.INSTAGRAM_USER_ID }}
          IG_API_HOST: ${{ vars.IG_API_HOST || 'graph.facebook.com' }}
          # Liste des modèles seulement (gratuit, aucune génération).
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          npm ci --no-audit --no-fund >/dev/null 2>&1 || npm install --no-audit --no-fund >/dev/null 2>&1 || true
          (cd studio && npm ci --no-audit --no-fund --ignore-scripts >/dev/null 2>&1) || true
          node outils/veille-technique.mjs
      # Dossiers Drive du directeur (22/11/2026) : nouvelles vidéos repérées chaque jour (fiche qualité : luminosité, netteté,
      # couleurs, doublons) et tempo des nouvelles musiques, pour les montages TikTok. Sans IA.
      - name: Dossiers Drive (vidéos et musiques)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          command -v ffmpeg >/dev/null || timeout 240 sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null 2>&1 || true
          python3 -c "import numpy" 2>/dev/null || pip install --quiet numpy
          node src/drive.mjs
      # Agendas ouverts (22/11/2026) : DATAtourisme (export quotidien des offices de tourisme, sans clé) et OpenAgenda (agendas
      # officiels des villes, clé gratuite OPENAGENDA_KEY) : soirées de la Côte, d'Occitanie et des grandes villes. Sans IA.
      - name: Agendas ouverts (DATAtourisme, OpenAgenda)
        continue-on-error: true
        timeout-minutes: 15
        env:
          OPENAGENDA_KEY: ${{ secrets.OPENAGENDA_KEY || '' }}
        run: node src/agendas.mjs
      # Visites du site (GoatCounter, sans cookie) pour le tableau de bord ; clé en lecture seule dans le secret GOATCOUNTER_TOKEN.
      - name: Visites du site
        continue-on-error: true
        env:
          GOATCOUNTER_TOKEN: ${{ secrets.GOATCOUNTER_TOKEN || '' }}
        run: node outils/visites.mjs
      - name: Enregistrer
        if: always()
        run: |
          git config user.name "teufy-bot"
          git config user.email "teufy-bot@users.noreply.github.com"
          git add -A -- contenus/veille-technique.json contenus/drive.json contenus/visites.json contenus/agendas.json
          git diff --cached --quiet && exit 0
          git commit -m "Teufy : veille technique du jour [skip ci]"
          for i in 1 2 3; do git pull --rebase -X theirs --autostash && git push && break; git rebase --abort 2>/dev/null; sleep 5; done

      # Sauvegarde quotidienne du site et des robots (21/11/2026) : une étiquette « sauvegarde-AAAA-MM-JJ » sur l'état du dépôt,
      # gardée 90 jours ; une page entière (site, données, médias) peut être remise en ligne avec « Mise en ligne du site ».
      - name: Sauvegarde du jour
        if: always()
        run: |
          git fetch -q --tags origin || true
          T="sauvegarde-$(date -u +%F)"
          git rev-parse -q --verify "refs/tags/$T" >/dev/null || { git tag "$T" origin/main 2>/dev/null || git tag "$T"; git push -q origin "$T"; echo "Sauvegarde $T créée."; }
          LIMITE=$(date -u -d '90 days ago' +%F)
          for t in $(git tag -l 'sauvegarde-*'); do [ "${t#sauvegarde-}" \< "$LIMITE" ] && git push -q origin ":refs/tags/$t" && echo "Ancienne sauvegarde $t retirée."; done || true

