name: Teufy - Paiements

# Toutes les heures : lit les paiements et abonnements Stripe des formules Teufy, met à jour les partenaires payants
# (badge, logo dans la vitrine, mise en avant), envoie le mail de bienvenue au client et la feuille de route à l'équipe,
# retire automatiquement un partenaire résilié. Le site n'est régénéré que s'il y a un changement.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: teufy-paiements
  cancel-in-progress: false

jobs:
  paiements:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY || secrets.STRIPE_KEY || secrets.STRIPE_SECRET_KEY }}
      BREVO_API_KEY: ${{ secrets.BREVO_API_KEY || secrets.BREVO_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_KEY || secrets.GOOGLE_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.CLAUDE_API_KEY }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN || secrets.INSTAGRAM_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID || secrets.INSTAGRAM_USER_ID }}
      IG_API_HOST: ${{ vars.IG_API_HOST || 'graph.facebook.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Paiements Stripe → partenaires
        id: paiements
        run: node src/paiements.mjs
      - name: Mettre le site à jour (seulement si un partenaire a changé)
        if: steps.paiements.outputs.change == 'true'
        run: |
          npm install --no-audit --no-fund >/dev/null 2>&1 || true
          sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null 2>&1 || true
          SITE_MINUTES=6 node src/run.mjs site --force || true
      - name: Enregistrer
        if: steps.paiements.outputs.change == 'true'
        run: |
          git config user.name "teufy-bot"
          git config user.email "teufy-bot@users.noreply.github.com"
          git add -A -- $(ls -d contenus index.html 404.html site a-propos soirees-* soiree festivals actus partenaires avantages ambassadeurs bde clubs-bars ce-soir mentions-legales cgu cgv confidentialite dates restaurants activites france occitanie en it es zh ar sitemap.xml robots.txt llms.txt sw.js 2>/dev/null) || true
          git diff --cached --quiet && exit 0
          git commit -m "Teufy : partenaires payants mis à jour (Stripe)"
          for i in 1 2 3; do git pull --rebase -X theirs --autostash && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
