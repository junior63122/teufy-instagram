name: Teufy - Instagram automatique

# Chaque jour, de 15h à 19h UTC (16h-20h l'hiver, 17h-21h l'été à Paris) :
#  - une fois par semaine, l'analyse par IA gratuite (Gemini / GitHub Models) : veille des nouveautés
#    Instagram/Meta, pourquoi certains posts marchent mieux, nouvelles accroches/intros/débats à tester ;
#  - relève les statistiques Instagram des derniers posts
#    (apprentissage.json + RAPPORT.md) pour améliorer les choix suivants ;
#  - si le calendrier de config.json prévoit une publication ce jour-là,
#    publie à l'heure qui a le mieux marché jusqu'ici (apprise automatiquement).
# Par mois : 2 incontournables (commercial, techno), 2 bons plans, 2 débats + 3 reels « plan continu illustré » par semaine (mardi, jeudi, samedi).
on:
  schedule:
    - cron: "7 15-22 * * *" # 15h-19h UTC : créneaux possibles ; 20h-22h : rattrapage si GitHub a sauté un passage
  workflow_dispatch:
    inputs:
      quoi:
        description: "Quoi générer"
        type: choice
        options:
          - mois (aperçu des publications du mois)
          - auto (la publication prévue aujourd'hui)
          - horaire (déclencheur externe, comme un passage programmé)
          - collecter (statistiques Instagram)
          - site (régénérer le site internet maintenant)
          - incontournables:commercial
          - incontournables:techno
          - incontournables:tekno
          - bonplan:petits-prix
          - bonplan:a-reserver
          - debat
          - reel:flash (prochain reel de la banque, sinon écrit par l'IA)
          - reel:nouveau (reel inédit écrit par l'IA, décors Gemini)
          - reel:explicatif
          - reel:humour
          - reel:immersif
          - reel:weekend
        default: mois (aperçu des publications du mois)
      publier:
        description: "Publier vraiment sur Instagram (sinon : aperçu téléchargeable seulement)"
        type: boolean
        default: false
      exception_ia:
        description: "Exception du directeur : autoriser Gemini/Claude pour ce lancement manuel (sinon aucune IA payante)"
        type: boolean
        default: false

permissions:
  contents: write
  models: read # GitHub Models : IA gratuite incluse dans GitHub Actions

concurrency:
  group: teufy-instagram
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    timeout-minutes: 110 # recherches IA (16 + Occitanie + France) puis site : 60 min ne suffisaient plus
    env:
      # Clés : plusieurs noms de secrets acceptés (ElevenLabs, Gemini, Claude, Instagram…)
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY || secrets.ELEVENLABS_KEY || secrets.ELEVENLABS || secrets.ELEVEN_LABS || secrets.ELEVEN_LABS_API_KEY || secrets.ELEVEN_LABS_KEY || secrets.ELEVENLABS_TOKEN || secrets.ELEVEN_API_KEY || secrets.ELEVEN_KEY || secrets.ELEVEN || secrets.XI_API_KEY || secrets.ELEVENLABS_API || secrets.CLE_ELEVENLABS || secrets.ELEVENLABS_SECRET || secrets.ELEVENLABSAPIKEY || secrets.API_ELEVENLABS || vars.ELEVENLABS_API_KEY || vars.ELEVENLABS_KEY || vars.ELEVENLABS || vars.ELEVEN_LABS || vars.ELEVEN_LABS_API_KEY || vars.ELEVEN_LABS_KEY }}
      GEMINI_API_KEY: ${{ (github.event_name == 'schedule' || startsWith(inputs.quoi, 'horaire') || inputs.exception_ia) && (secrets.GEMINI_API_KEY || secrets.GEMINI_KEY || secrets.GEMINI || secrets.GOOGLE_API_KEY || secrets.GOOGLE_AI_KEY || secrets.GOOGLE_AI_API_KEY || secrets.GEMINI_TOKEN || secrets.AI_STUDIO_KEY || secrets.CLE_GEMINI || secrets.API_GEMINI) || '' }}
      ANTHROPIC_API_KEY: ${{ (github.event_name == 'schedule' || startsWith(inputs.quoi, 'horaire') || inputs.exception_ia) && (secrets.ANTHROPIC_API_KEY || secrets.ANTHROPIC_KEY || secrets.ANTHROPIC || secrets.CLAUDE_API_KEY || secrets.CLAUDE_KEY || secrets.CLAUDE) || '' }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN || secrets.INSTAGRAM_ACCESS_TOKEN || secrets.INSTAGRAM_TOKEN || secrets.IG_TOKEN || secrets.META_ACCESS_TOKEN || secrets.FB_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID || secrets.INSTAGRAM_USER_ID || secrets.INSTAGRAM_ID || secrets.IG_ID || secrets.IG_ACCOUNT_ID || secrets.INSTAGRAM_ACCOUNT_ID }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || secrets.PEXELS_KEY || secrets.PEXELS }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY || secrets.PIXABAY_KEY || secrets.PIXABAY }}
      # Règle du directeur : IA payante seulement pour les passages automatiques (horaire GitHub ou déclencheur externe).
      TEUFY_IA_MANUEL: ${{ (github.event_name == 'schedule' || startsWith(inputs.quoi, 'horaire') || inputs.exception_ia) && '0' || '1' }}
      IG_API_HOST: ${{ vars.IG_API_HOST || 'graph.facebook.com' }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub Models, gratuit
      MEDIA_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/media
      MEDIA_FALLBACK_URL: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/media
    steps:
      - uses: actions/checkout@v4
      - name: Clés disponibles (noms seulement, jamais les valeurs)
        run: |
          for v in ELEVENLABS_API_KEY GEMINI_API_KEY ANTHROPIC_API_KEY IG_ACCESS_TOKEN IG_USER_ID PEXELS_API_KEY PIXABAY_API_KEY; do
            if [ -n "${!v}" ]; then echo "$v : ok"; else echo "$v : absente"; fi
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Relever les statistiques (apprentissage)
        # Chaque post est mesuré au plus une fois par jour (de J+1 à J+21) : les passages suivants ne font presque rien.
        if: github.event_name == 'schedule' || startsWith(inputs.quoi, 'collecter') || startsWith(inputs.quoi, 'horaire') || startsWith(inputs.quoi, 'site')
        run: |
          npm install --no-audit --no-fund
          node src/run.mjs collecter
          # Site internet (agenda des soirées) : régénéré une fois par jour.
          sudo apt-get install -y --no-install-recommends ffmpeg >/dev/null 2>&1 || true
          node outils/photos-spots.mjs || echo "::warning::Photos des spots non récupérées" # photos libres (Wikimedia), seulement les manquantes
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-fra >/dev/null 2>&1 || true # repère les « photos de lieu » qui sont des affiches
          node src/run.mjs site $([ "${{ startsWith(inputs.quoi, 'site') }}" = "true" ] && echo --force) || echo "::warning::Site non régénéré"
          node outils/controle-donnees.mjs || echo "::warning::Contrôle des données du site : erreurs à corriger"
          git config user.name "teufy-bot"
          git config user.email "teufy-bot@users.noreply.github.com"
          git add -A -- $(ls -d apprentissage.json config.json RAPPORT.md ANALYSE.md tendances-auto.json contenus veille index.html .nojekyll site a-propos soirees-* soiree festivals actus partenaires ambassadeurs bde mentions-legales cgu cgv confidentialite dates restaurants activites france occitanie clubs-bars evenements-france.json evenements-occitanie.json 404.html en it es zh ar sitemap.xml robots.txt llms.txt .well-known *.txt CNAME sw.js evenements-web.json 2>/dev/null) || true # seulement les chemins existants (un seul absent bloquait tout)
          git diff --cached --quiet && exit 0
          git commit -m "Teufy Instagram : statistiques du $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs --autostash && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
          sleep 90; node outils/indexnow.mjs || true # pages signalées aux moteurs (Bing → ChatGPT) une fois le site publié

      - name: Quelle publication ?
        id: choix
        run: |
          QUOI="${{ inputs.quoi || 'auto' }}"
          QUOI="${QUOI%% *}"
          if [ "$QUOI" = "collecter" ]; then echo "rien=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$QUOI" = "site" ]; then echo "rien=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$QUOI" = "horaire" ]; then QUOI=auto; HORAIRE=1; fi # déclencheur externe (cron-job.org) = passage programmé
          if [ "$QUOI" = "auto" ]; then
            if [ "${{ github.event_name }}" = "schedule" ] || [ -n "$HORAIRE" ]; then SLOT=$(node src/run.mjs auto --quoi --horaire); else SLOT=$(node src/run.mjs auto --quoi); fi
            [ "$SLOT" = "rien" ] && echo "Rien à publier maintenant." && echo "rien=true" >> "$GITHUB_OUTPUT"
          fi
          PUBLIER=false
          if [ "${{ github.event_name }}" = "schedule" ] || [ -n "$HORAIRE" ] || [ "${{ inputs.publier }}" = "true" ]; then PUBLIER=true; fi
          [ "$QUOI" = "mois" ] && PUBLIER=false
          if [ -z "$IG_ACCESS_TOKEN" ] || [ -z "$IG_USER_ID" ]; then
            echo "::warning::Secrets IG_ACCESS_TOKEN / IG_USER_ID absents : aperçu seulement, rien n'est publié."
            PUBLIER=false
          fi
          echo "quoi=$QUOI" >> "$GITHUB_OUTPUT"
          echo "publier=$PUBLIER" >> "$GITHUB_OUTPUT"
          echo "Cible : $QUOI · publication : $PUBLIER"

      - name: Installer Chromium, ffmpeg et polices
        if: steps.choix.outputs.rien != 'true'
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-noto-color-emoji tesseract-ocr tesseract-ocr-fra # tesseract : contrôle gratuit des affiches (dates lues)
          npm ci --prefix studio --no-audit --no-fund # studio Remotion (reels créatifs)

      - name: Tests
        if: steps.choix.outputs.rien != 'true'
        run: npm test

      - name: Récupérer les soirées et générer les visuels
        if: steps.choix.outputs.rien != 'true'
        env:
          TEUFY_PUBLICATION: '1' # le plafond IA du jour ne bloque jamais la création du post (exception)
        run: node src/run.mjs ${{ steps.choix.outputs.quoi }} preparer

      - name: Sauvegarder la recherche de soirées (réutilisée 3 jours, évite de payer deux fois)
        if: always() && steps.choix.outputs.rien != 'true'
        run: |
          git config user.name "teufy-bot"
          git config user.email "teufy-bot@users.noreply.github.com"
          git add -A -- $(ls -d evenements-web.json contenus/organisateurs.json contenus/budget-ia.json 2>/dev/null) || true # seulement les chemins existants (un seul absent bloquait tout)
          git add -A -- $(ls -d studio/scripts/concepts studio/scripts/decors studio/public 2>/dev/null) || true # seulement les chemins existants (un seul absent bloquait tout)
          git diff --cached --quiet && exit 0
          git commit -m "Teufy : soirées et reels préparés le $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs --autostash && git push && break; git rebase --abort 2>/dev/null; sleep 5; done

      - name: Garder l'aperçu dans le dépôt (pour le relire avant publication)
        if: steps.choix.outputs.publier != 'true' && steps.choix.outputs.rien != 'true' && steps.choix.outputs.quoi != 'mois'
        run: |
          git config user.name "teufy-bot"
          git config user.email "teufy-bot@users.noreply.github.com"
          mkdir -p apercus && rm -rf apercus/* && cp -r media/* apercus/ 2>/dev/null || true
          git add -A -- $(ls -d apercus 2>/dev/null) || true # seulement les chemins existants (un seul absent bloquait tout)
          git diff --cached --quiet && exit 0
          git commit -m "Teufy : aperçu ${{ steps.choix.outputs.quoi }} du $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs --autostash && git push && break; git rebase --abort 2>/dev/null; sleep 5; done

      - name: Aperçu téléchargeable (visuels, vidéos, légendes, pages récupérées)
        if: always() && steps.choix.outputs.rien != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: teufy-${{ github.run_number }}
          path: |
            media/
            out/debug/
          retention-days: 14

      - name: Mettre les médias en ligne (GitHub Pages)
        if: steps.choix.outputs.publier == 'true' && steps.choix.outputs.rien != 'true'
        run: |
          git config user.name "teufy-bot"
          git config user.email "teufy-bot@users.noreply.github.com"
          git add -A -- $(ls -d media evenements-web.json contenus/organisateurs.json 2>/dev/null) || true # seulement les chemins existants (un seul absent bloquait tout)
          git diff --cached --quiet && exit 0
          git commit -m "Teufy Instagram : médias ${{ steps.choix.outputs.quoi }} du $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs --autostash && git push && break; git rebase --abort 2>/dev/null; sleep 5; done

      - name: Publier sur Instagram
        if: steps.choix.outputs.publier == 'true' && steps.choix.outputs.rien != 'true'
        run: node src/run.mjs ${{ steps.choix.outputs.quoi }} publier

      - name: Enregistrer l'historique
        if: always() && steps.choix.outputs.publier == 'true' && steps.choix.outputs.rien != 'true'
        run: |
          git config user.name "teufy-bot"
          git config user.email "teufy-bot@users.noreply.github.com"
          git add -A -- $(ls -d historique.json contenus/comptes-verifies.json contenus/budget-ia.json 2>/dev/null) || true # seulement les chemins existants (un seul absent bloquait tout)
          git diff --cached --quiet && exit 0
          git commit -m "Teufy Instagram : publié (${{ steps.choix.outputs.quoi }})"
          for i in 1 2 3; do git pull --rebase -X theirs --autostash && git push && break; git rebase --abort 2>/dev/null; sleep 5; done
