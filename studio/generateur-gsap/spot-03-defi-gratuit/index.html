<!doctype html><html><head><meta charset="utf-8">

<style>

</style></head><body>
<div id="stage">
 <div id="fond" style="position:absolute;inset:0;background:#F4EFE6"></div>
 <div id="raies"></div>
 <!-- 0 : le défi -->
 <div class="scene" id="s0">

 <div id="phone"><div class="ecr">
  <img class="c" id="g1" src="img/g1.jpg"><img class="c" id="g2" src="img/g2.jpg"><img class="c" id="g3" src="img/g3.jpg">

 </div><div class="notch"></div></div>
 <div class="tap" id="tp1"></div><div class="tap" id="tp2"></div><div class="tap" id="tp3"></div>
 <div id="badge"><div style="font-family:Bric;font-weight:800;font-stretch:80%;font-size:92px;line-height:1">Entrée libre</div><div style="font-size:46px;font-weight:800;margin-top:10px;color:var(--jaune)">ou petits prix (10 € max)</div></div>
 <div id="tampon">GRATUIT</div>
 <!-- 6 : résultat -->

 </div>
 <!-- 7 : à toi -->
 <div class="scene" id="s7">
  <div class="k" id="t7" style="top:280px;font-size:120px">À <em>toi</em> de jouer</div>
  <img id="logoBig" src="img/logo.png" style="position:absolute;left:390px;top:470px;width:300px;background:var(--nuit);border-radius:50%;padding:46px">

  <div class="glass" id="follow" style="left:190px;top:980px;width:700px;height:150px;display:flex;align-items:center;gap:24px;padding:0 36px">
   <img src="img/logo.png" style="width:86px;background:var(--nuit);border-radius:50%;padding:10px">
   <div style="flex:1;font-size:40px;font-weight:800">@teufy_official</div>
   <div id="btn" style="background:var(--corail);color:var(--nuit);font-weight:900;font-size:36px;padding:16px 28px;border-radius:18px">S'abonner</div>
  </div>
 </div>
 <div id="confs"></div>
 <div id="caps"><div id="capbox"></div></div>
 <div id="flash"></div>
</div>
<script src="../node_modules/gsap/dist/gsap.min.js"></script>
<script>
function rnd(i){const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)}
let TL=[],tl,WORDS=[],CHUNKS=[],S=[],END=0;const $=id=>document.getElementById(id);
function buildCaps(){WORDS=[];TL.forEach(g=>g.words.forEach(([w,s,e])=>{if(/^[^\wÀ-ÿ€0-9]+$/.test(w)){if(WORDS.length){WORDS[WORDS.length-1].e=e;WORDS[WORDS.length-1].stop=true}return}
    WORDS.push({w:w.replace(/[,:…!?]+$/,'').replace(/\s*!$/,'').replace(/\.$/,''),s,e,seg:g.i,stop:/[.?!:,…]$/.test(w)})}));
  let cur=[];WORDS.forEach((w,i)=>{cur.push(i);const n=WORDS[i+1];if(cur.length>=3||!n||n.seg!==w.seg||w.stop){CHUNKS.push(cur);cur=[]}})}
const HOT=/^(défi|gratuite|dix|secondes|chrono|teufy|gratuit|ville|voilà|libre|petits|prix|trop|facile|toi|jouer|teufyparty\.com)$/i;
function renderCaps(t){const ci=CHUNKS.findIndex((c,k)=>t>=WORDS[c[0]].s-.05&&t<(CHUNKS[k+1]?WORDS[CHUNKS[k+1][0]].s-.05:WORDS[c[c.length-1]].e+.6));
  const box=$('capbox');if(ci<0){box.style.opacity=0;return}box.style.opacity=1;const c=CHUNKS[ci];
  box.innerHTML=c.map(i=>{const w=WORDS[i];const on=t>=w.s-.03;return `<span class="w${on&&HOT.test(w.w)?' on':''}" style="opacity:${on?1:.35}">${w.w.toUpperCase()}</span>`}).join('');
  const p=Math.min(1,(t-WORDS[c[0]].s+.05)/.15);box.style.transform=`scale(${.85+.15*p})`}
function wt(i,sub,n=0){const ws=TL[i].words.filter(w=>w[0].toLowerCase().includes(sub));return ws[n]?ws[n][1]:TL[i].start}
// confettis : salves pré-créées, positions pseudo-aléatoires fixes (rendu image par image reproductible)
const SALVES=[];function salve(at,x,y,n=46){const els=[];for(let k=0;k<n;k++){const d=document.createElement('div');d.className='conf';d.style.background=['#FF5A3C','#3DFF8A','#FF2BD6','#FFD23F','#F4EFE6'][k%5];d.style.left=x+'px';d.style.top=y+'px';d.style.opacity=0;$('confs').appendChild(d);els.push(d)}
  els.forEach((d,k)=>{const a=rnd(k+at*7)*Math.PI*2,v=350+rnd(k+3+at)*650;tl.set(d,{opacity:1},at);tl.fromTo(d,{x:0,y:0,rotation:0},{x:Math.cos(a)*v,y:Math.sin(a)*v*.7+500,rotation:rnd(k)*900,duration:1.4,ease:'power2.out',immediateRender:false},at);tl.to(d,{opacity:0,duration:.3},at+1.1)})}
// téléphone : écran à (264, 514), captures de 1080 px réduites à 552 px (× 0,511)
const PH=(x,y)=>[264+x*.511,514+y*.511];
function build(){S=TL.map(g=>g.start);END=TL[TL.length-1].start+TL[TL.length-1].dur+1.3;
  tl=gsap.timeline({paused:true});
  gsap.set(['#s6','#s7'],{autoAlpha:0});gsap.set('#flash',{opacity:0});
  const montre=(id,at,jusqua)=>{tl.set('#'+id,{autoAlpha:1},at);tl.set('#'+id,{autoAlpha:0},jusqua)};
  const flash=(at,o=.7)=>tl.fromTo('#flash',{opacity:o},{opacity:0,duration:.2,ease:'power2.out',immediateRender:false},at);
  const choc=(at,a=22)=>tl.fromTo('#stage',{x:a,y:-a*.6},{x:0,y:0,duration:.35,ease:'elastic.out(1,.3)',immediateRender:false},at);
  const tape=(id,[x,y],at)=>{gsap.set('#'+id,{left:x,top:y});tl.fromTo('#'+id,{scale:.4,opacity:1},{scale:1.8,opacity:0,duration:.4,ease:'power2.out',immediateRender:false},at)};
  const ecran=(id,at)=>{tl.set(['#g1','#g2','#g3','#splash'],{opacity:0},at);tl.set(id,{opacity:1},at)};
  tl.fromTo('#raies',{x:0},{x:280,duration:END,ease:'none'},0);
  // --- 0 : le défi
  montre('s0',0,S[1]);tl.fromTo('#defi',{scale:1.18,rotation:-8},{scale:1,rotation:-4,duration:.3,ease:'back.out(3)'},0);
  tl.fromTo('#t0',{scale:1.12},{scale:1,duration:.3,ease:'back.out(2)'},0);[...document.querySelectorAll('.m0')].forEach((e,k)=>{const at=[wt(0,'trouver'),wt(0,'soirée'),wt(0,'gratuite'),wt(0,'en'),wt(0,'moins'),wt(0,'de')][k];tl.fromTo(e,{color:'#FF5A3C',scale:1.4},{color:k===2?'#FF5A3C':'#0B0B0F',scale:1,duration:.18,ease:'back.out(3)',immediateRender:false,display:'inline-block'},at)});tl.to('#defi',{rotation:-1,scale:1.04,duration:.25,yoyo:true,repeat:5,ease:'sine.inOut'},.35);tl.fromTo('#raies',{y:0},{y:-280,duration:3.1,ease:'none',immediateRender:false},0);
  tl.to('#t0 em',{scale:1.15,duration:.12,yoyo:true,repeat:1,display:'inline-block'},wt(0,'gratuite'));choc(wt(0,'gratuite'),12);
  tl.fromTo('#dix',{scale:2.4,opacity:0},{scale:1,opacity:1,duration:.22,ease:'power4.out',immediateRender:false},wt(0,'dix'));choc(wt(0,'dix'),30);flash(wt(0,'dix'),.35);
  tl.to('#defi',{rotation:4,duration:.08,yoyo:true,repeat:5,ease:'none'},wt(0,'secondes'));
  // --- 1 : top chrono : le chrono tombe et démarre (le temps affiché est le vrai temps écoulé)
  const c0=wt(1,'chrono'),c1=S[6],ecoule=c1-c0;
  tl.fromTo('#chrono',{y:-300,opacity:0},{y:0,opacity:1,duration:.3,ease:'back.out(2)',immediateRender:false},S[1]);flash(c0,.6);choc(c0,26);
  const ch={v:0};const aff=()=>{$('sec').textContent=String(Math.floor(ch.v)).padStart(2,'0');$('dec').textContent=String(Math.floor(ch.v*10)%10)};
  tl.fromTo('#topc',{scale:2.5,opacity:0},{scale:1,opacity:1,duration:.2,ease:'power4.out',immediateRender:false},c0);tl.set('#topc',{opacity:0},S[2]-.05);
  tl.fromTo(ch,{v:0},{v:ecoule,duration:ecoule,ease:'none',onUpdate:aff,immediateRender:false},c0);
  tl.set('#phone',{opacity:1},S[2]-.05);tl.fromTo('#phone',{y:1300,rotation:-10},{y:0,rotation:0,duration:.4,ease:'back.out(1.4)',immediateRender:false},S[2]-.05);
  // --- 2 : 1. Ouvre Teufy
  ecran('#splash',S[2]-.05);tl.fromTo('#splash img',{scale:.3},{scale:1,duration:.3,ease:'back.out(3)',immediateRender:false},wt(2,'teufy')-.1);
  tl.fromTo('#e1',{x:-400,opacity:0},{x:0,opacity:1,duration:.25,ease:'back.out(2)',immediateRender:false},S[2]);tl.set('#e1',{opacity:0},S[3]);
  // --- 3 : 2. Gratuit
  ecran('#g1',wt(3,'vas'));tl.fromTo('#g1',{x:552},{x:0,duration:.22,ease:'power3.out',immediateRender:false},wt(3,'vas'));
  tl.fromTo('#e2',{x:-400,opacity:0},{x:0,opacity:1,duration:.25,ease:'back.out(2)',immediateRender:false},S[3]);tl.set('#e2',{opacity:0},S[4]);
  tape('tp1',PH(171,288),wt(3,'gratuit'));choc(wt(3,'gratuit'),10);
  // --- 4 : 3. Ta ville : « Où » puis « Nice »
  tl.fromTo('#e3',{x:-400,opacity:0},{x:0,opacity:1,duration:.25,ease:'back.out(2)',immediateRender:false},S[4]);tl.set('#e3',{opacity:0},S[5]);
  tape('tp2',PH(609,1404),wt(4,'tu'));ecran('#g2',wt(4,'tu')+.14);
  tape('tp3',PH(399,1284),wt(4,'ville'));ecran('#g3',wt(4,'ville')+.14);tl.set('#cacheDate',{opacity:1},wt(4,'ville')+.14);choc(wt(4,'ville')+.14,10);
  // --- 5 : et voilà : entrée libre ou petits prix
  tl.fromTo('#badge',{scale:0,opacity:0},{scale:1,opacity:1,duration:.25,ease:'back.out(2.2)',immediateRender:false},wt(5,'voilà'));
  tl.fromTo('#tampon',{scale:3,opacity:0},{scale:1,opacity:1,duration:.16,ease:'power4.in',immediateRender:false},wt(5,'entrée'));choc(wt(5,'entrée')+.16,30);
  tl.to('#phone',{rotation:-3,duration:.2,ease:'power2.out'},wt(5,'petits'));
  // --- 6 : le chrono s'arrête : le vrai temps, « trop facile »
  tl.set(['#phone','#badge','#tampon'],{opacity:0},S[6]);montre('s6',S[6],S[7]);flash(S[6],1);choc(S[6],30);
  $('resultat').innerHTML=`${(Math.floor(ecoule*10)/10).toFixed(1).replace('.',',')}<span style="font-size:130px;color:var(--corail)"> s</span>`;
  tl.fromTo('#resultat',{scale:2.2,opacity:0},{scale:1,opacity:1,duration:.22,ease:'power4.out',immediateRender:false},S[6]);
  tl.to('#chrono',{scale:1.15,duration:.12,yoyo:true,repeat:3},S[6]);
  tl.fromTo('#facile',{scale:3,opacity:0},{scale:1,opacity:1,duration:.18,ease:'power4.in',immediateRender:false},wt(6,'trop'));choc(wt(6,'trop')+.18,34);
  salve(wt(6,'facile'),540,1000,46);
  // --- 7 : à toi de jouer
  tl.set('#chrono',{opacity:0},S[7]);montre('s7',S[7],END+1);flash(S[7],.8);
  tl.from('#t7',{scale:.4,opacity:0,duration:.3,ease:'back.out(2)'},S[7]);tl.from('#logoBig',{scale:0,rotation:-25,duration:.45,ease:'back.out(2.4)'},S[7]+.1);tl.to('#logoBig',{scale:1.08,duration:.23,yoyo:true,repeat:9,ease:'sine.inOut'},S[7]+.6);
  tl.from('#follow',{y:300,opacity:0,duration:.4,ease:'back.out(1.6)'},S[7]+.2);
  const url='teufyparty.com',u={v:0};tl.to(u,{v:url.length,duration:.7,ease:'none',onUpdate:()=>$('url').textContent=url.slice(0,Math.round(u.v))},wt(7,'teufyparty')-.1);
  tl.to('#curseur',{opacity:0,duration:.25,yoyo:true,repeat:9,ease:'steps(1)'},S[7]);
  tl.to('#btn',{scale:.88,duration:.1,yoyo:true,repeat:1},wt(7,'teufyparty')+.8);tl.set('#btn',{textContent:'Abonné ✓',background:'#3DFF8A'},wt(7,'teufyparty')+1);
  const FONDS=[[S[1],'#0B0B0F'],[S[2]-.05,'#F4EFE6'],[S[3],'#FF5A3C'],[S[4],'#FFD23F'],[S[5],'#F4EFE6'],[S[6],'#0B0B0F'],[S[7],'#F4EFE6']];
  FONDS.forEach(([at,c])=>{tl.set('#fond',{backgroundColor:c},at);flash(at,.45)});
  tl.set('#topc',{color:'#F4EFE6'},0);tl.set('#s6 .k',{color:'#F4EFE6'},0);tl.set('#resultat',{color:'#F4EFE6'},0);tl.set('#facile',{backgroundColor:'#FF5A3C',color:'#0B0B0F'},0);
  tl.set(['#e2','#e3'],{color:'#0B0B0F'},0);
  [[wt(3,'gratuit'),PH(171,288)],[wt(4,'tu'),PH(609,1404)],[wt(4,'ville'),PH(399,1284)]].forEach(([at,[x,y]])=>{tl.set('#phone',{transformOrigin:`${x-250}px ${y-500}px`},at-.12);tl.to('#phone',{scale:1.45,duration:.12,ease:'power3.out'},at-.12);tl.to('#phone',{scale:1,duration:.25,ease:'power3.inOut'},at+.25)});
  tl.to({},{duration:.01},END);return END}
window.init=async(tlData)=>{TL=tlData;buildCaps();await document.fonts.ready;await Promise.all([...document.images].map(i=>i.decode().catch(()=>{})));return build()};
window.seek=t=>{tl.seek(t,false);renderCaps(t)};
</script></body></html>
